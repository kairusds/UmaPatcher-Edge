plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp' version '1.9.20-1.0.14'
    id 'com.mikepenz.aboutlibraries.plugin'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.leadrdrk.umapatcher"
        applicationIdSuffix ".edge"
        minSdk 24
        targetSdk 34
        versionCode 17
        versionName "1.4.0"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        release {
            storeFile file(System.getenv("SIGNING_KEY_FILE"))
            storePassword System.getenv("SIGNING_STORE_PASSWORD")
            keyAlias System.getenv("SIGNING_KEY_ALIAS")
            keyPassword System.getenv("SIGNING_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        debug {
            shrinkResources false
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        buildConfig true
        aidl true
    }
    composeOptions {
        kotlinCompilerExtensionVersion compose_version
    }
    packagingOptions {
        resources {
            excludes += "META-INF/*"
        }
    }
    lint {
        disable.add("MissingTranslation")
    }
    namespace 'com.leadrdrk.umapatcher'
}

kotlin {
    jvmToolchain(8)
}

aboutLibraries {
    configPath = "config"
}

def extensionsSrcDir = file('src/main/extensions')
def extensionsSdkDir = {
    def sdkDir = android.hasProperty('sdkDirectory') ? android.sdkDirectory : null
    if (sdkDir != null) {
        return sdkDir
    }
    def localProps = rootProject.file('local.properties')
    if (localProps.isFile()) {
        String configured = null
        localProps.eachLine { line ->
            if (configured == null && line.startsWith('sdk.dir=')) {
                configured = line.substring('sdk.dir='.length()).trim()
            }
        }
        if (configured != null) {
            return file(configured)
        }
    }
    String envDir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    if (envDir != null) {
        return file(envDir)
    }
    throw new GradleException('extensions dex: Android SDK directory could not be resolved')
}()

def extensionsPlatformJar = {
    String compileSdk = android.compileSdkVersion?.toString() ?: 'android-34'
    if (!compileSdk.startsWith('android-')) {
        compileSdk = "android-${compileSdk}"
    }
    def jar = new File(new File(new File(extensionsSdkDir, 'platforms'), compileSdk), 'android.jar')
    if (!jar.isFile()) {
        throw new GradleException("extensions dex: platform jar not found: ${jar}")
    }
    jar
}()

def extensionsD8Jar = {
    def buildToolsRoot = new File(extensionsSdkDir, 'build-tools')
    List<File> candidates = []
    if (buildToolsRoot.isDirectory()) {
        buildToolsRoot.listFiles().each { dir ->
            def jar = new File(new File(dir, 'lib'), 'd8.jar')
            if (dir.isDirectory() && jar.isFile()) {
                candidates += jar
            }
        }
    }
    if (candidates.isEmpty()) {
        throw new GradleException("extensions dex: no d8.jar found in any build-tools version under ${buildToolsRoot}; install the Android SDK build-tools package")
    }
    candidates.toSorted { left, right ->
        org.gradle.util.VersionNumber.parse(left.parentFile.parentFile.name) <=>
                org.gradle.util.VersionNumber.parse(right.parentFile.parentFile.name)
    }.last()
}()

def extensionsClassesDir = layout.buildDirectory.dir('extensions/classes')
def extensionsDexDir = layout.buildDirectory.dir('extensions/dex')
def extensionsAssetsDir = layout.buildDirectory.dir('generated/extensionsAssets')

def compileExtensionsJava = tasks.register('compileExtensionsJava', JavaCompile) {
    source = extensionsSrcDir
    include '**/*.java'
    classpath = files(extensionsPlatformJar)
    destinationDirectory = extensionsClassesDir
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

def dexExtensions = tasks.register('dexExtensions', JavaExec) {
    dependsOn compileExtensionsJava
    mainClass = 'com.android.tools.r8.D8'
    classpath = files(extensionsD8Jar)
    inputs.dir extensionsClassesDir
    outputs.dir extensionsDexDir
    doFirst {
        def dexOut = extensionsDexDir.get().asFile
        dexOut.mkdirs()
        def classesRoot = extensionsClassesDir.get().asFile
        List<File> classFiles = []
        classesRoot.eachFileRecurse { file ->
            if (file.isFile() && file.name.endsWith('.class')) {
                classFiles += file
            }
        }
        classFiles = classFiles.toSorted { left, right -> left.name <=> right.name }
        if (classFiles.isEmpty()) {
            throw new GradleException("extensions dex: no class files under ${classesRoot}")
        }
        args(['--release', '--min-api', '21', '--lib', extensionsPlatformJar.absolutePath,
              '--output', dexOut.absolutePath] + classFiles.collect { it.absolutePath })
    }
}

def generateExtensionsAsset = tasks.register('generateExtensionsAsset', Copy) {
    dependsOn dexExtensions
    from(extensionsDexDir) {
        include 'classes.dex'
        rename { 'extensions.dex' }
    }
    into extensionsAssetsDir
}

android.sourceSets.main.assets.srcDirs += extensionsAssetsDir.get().asFile
tasks.matching { t ->
    (t.name.startsWith('merge') && t.name.endsWith('Assets')) ||
            t.name.toLowerCase(Locale.ROOT).contains('lint')
}.configureEach {
    dependsOn generateExtensionsAsset
}

def cleanStaleExtensionsAsset = tasks.register('cleanStaleExtensionsAsset') {
    outputs.upToDateWhen { false }
    doLast {
        def stale = file('src/main/assets/extensions.dex')
        if (stale.isFile()) {
            logger.lifecycle("extensions: removing stale asset ${stale} (superseded by build-time generation)")
            stale.delete()
        }
    }
}

generateExtensionsAsset.configure { dependsOn cleanStaleExtensionsAsset }

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation 'androidx.compose.material3:material3:1.1.2'
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.navigation:navigation-compose:2.7.6'
    implementation 'androidx.datastore:datastore-preferences:1.0.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'io.github.raamcosta.compose-destinations:animations-core:1.9.55'
    ksp 'io.github.raamcosta.compose-destinations:ksp:1.9.55'
    implementation 'com.mikepenz:aboutlibraries-core:10.9.2'
    implementation 'com.mikepenz:aboutlibraries-compose:10.9.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.topjohnwu.libsu:core:5.2.2'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation 'com.android.tools.build:apksig:9.2.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.77'
    implementation 'io.github.reandroid:ARSCLib:1.2.4'
    
    // Shizuku
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_version"
}
